openapi: 3.0.0
info:
  version: 1.0.0
  title: Full API - Users, Sessions, Tasks
  description: API for managing users, sessions, tasks

servers:
  - url: /api

tags:
  - name: Session
    description: Endpoints related to session management
  - name: Users
    description: Endpoints for profile management
  - name: Tasks
    description: Endpoints for task management

paths:
  /session/me:
    get:
      tags:
        - Session
      operationId: getSession
      summary: Get current session
      description: |
        Retrieves information about the current session, including user details and session ID.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Unauthorized - User is not authenticated

  /session/sign-in:
    post:
      tags:
        - Session
      operationId: signIn
      summary: Sign in
      description: |
        Authenticates the user and returns session details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /session/sign-out:
    post:
      tags:
        - Session
      operationId: signOut
      summary: Sign out
      description: |
        Ends the current session for the authenticated user.
      responses:
        '200':
          description: Session successfully terminated
        '401':
          description: Unauthorized - User is not authenticated

  /tasks:
    get:
      tags:
        - Tasks
      operationId: getTasks
      summary: Get all tasks
      description: |
        Returns a list of all tasks.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      tags:
        - Tasks
      operationId: createTask
      summary: Create new task
      description: |
        Creates a new task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{id}:
    get:
      tags:
        - Tasks
      operationId: getTaskById
      summary: Get task by ID
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

    patch:
      tags:
        - Tasks
      operationId: updateTask
      summary: Update task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTask'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

    delete:
      tags:
        - Tasks
      operationId: deleteTask
      summary: Delete task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found

components:
  schemas:
    UserRole:
      type: string
      enum:
        - admin
        - editor
        - viewer
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        name:
          type: string
        avatarId:
          type: string
    CreateUser:
      type: object
      required:
        - id
        - email
        - password
        - role
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        password:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        name:
          type: string
        avatarId:
          type: string
    SignIn:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    Session:
      type: object
      required:
        - id
        - name
        - userId
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        avatarId:
          type: string
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    Task:
      type: object
      required:
        - id
        - title
        - description
        - completed
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
    CreateTask:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean
          default: false
    UpdateTask:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        completed:
          type: boolean

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Success:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
              error:
                type: string
                nullable: true
              success:
                type: boolean
